<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Placed | Glowzy House</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
body{
    margin:0;
    font-family:Poppins,sans-serif;
    background:#faf8f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.success-box{
    background:#fff;
    padding:50px;
    border-radius:20px;
    text-align:center;
    max-width:600px;
    width:90%;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.success-box i{
    font-size:80px;
    color:#b88a5a;
    margin-bottom:20px;
}

.success-box h1{
    color:#3b2e26;
    margin-bottom:15px;
}

.success-box p{
    color:#666;
    line-height:1.8;
    margin-bottom:30px;
}

.btn{
    display:inline-block;
    background:#b88a5a;
    color:#fff;
    padding:14px 35px;
    border-radius:40px;
    text-decoration:none;
    transition:.3s;
}

.btn:hover{
    background:#9d7248;
}
</style>

</head>
<body>

<div class="success-box">

<i class="fa-solid fa-circle-check"></i>

<h1>Order Placed Successfully!</h1>

<p>
Thank you for choosing <strong>Glowzy House</strong>. 🤍<br><br>

Your order has been received successfully.<br>
Our team will contact you shortly to confirm your order.
</p>

<a href="shop.html" class="btn">Continue Shopping</a>
<a href="index.html" class="btn">Back to Home</a>

</div>
</body>
</html>

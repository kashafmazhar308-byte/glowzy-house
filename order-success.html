<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed | Glowzy House</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box;}

body{
    margin:0;
    min-height:100vh;
    padding:24px;
    font-family:Poppins,sans-serif;
    background:
        radial-gradient(circle at top, rgba(184,138,90,.12), transparent 36%),
        #faf8f5;
    display:flex;
    justify-content:center;
    align-items:center;
}

.success-box{
    background:#fff;
    padding:48px 32px;
    border:1px solid rgba(184,138,90,.18);
    border-radius:24px;
    text-align:center;
    max-width:620px;
    width:100%;
    box-shadow:0 18px 50px rgba(59,46,38,.10);
}

.success-icon{
    width:86px;
    height:86px;
    margin:0 auto 22px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f4eadf;
    color:#b88a5a;
}

.success-icon i{
    font-size:42px;
    margin:0;
}

.eyebrow{
    display:inline-block;
    margin-bottom:10px;
    color:#b88a5a;
    font-size:12px;
    font-weight:600;
    letter-spacing:2px;
}

.success-box h1{
    color:#3b2e26;
    margin:0 0 14px;
    font-family:"Cormorant Garamond",Georgia,serif;
    font-size:clamp(34px,7vw,52px);
    line-height:1;
}

.success-box p{
    color:#666;
    line-height:1.8;
    margin:0 auto 22px;
    max-width:500px;
}

.success-note{
    margin:0 auto 28px;
    padding:14px 18px;
    border-radius:12px;
    background:#faf6f0;
    color:#6d5a4d;
    font-size:13px;
    line-height:1.6;
}

.actions{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    min-width:170px;
    padding:13px 24px;
    border-radius:40px;
    text-decoration:none;
    font-size:14px;
    font-weight:500;
    transition:.25s ease;
}

.btn-primary{
    background:#b88a5a;
    color:#fff;
}

.btn-primary:hover{
    background:#9d7248;
    transform:translateY(-1px);
}

.btn-secondary{
    background:#fff;
    color:#3b2e26;
    border:1px solid #d9c7b5;
}

.btn-secondary:hover{
    background:#faf6f0;
    transform:translateY(-1px);
}

@media(max-width:520px){
    .success-box{padding:38px 20px;}
    .actions{flex-direction:column;}
    .btn{width:100%;}
}
</style>

</head>
<body>

<main class="success-box">

<div class="success-icon">
    <i class="fa-solid fa-circle-check"></i>
</div>

<span class="eyebrow">GLOWZY HOUSE</span>

<h1>Order Placed Successfully!</h1>

<p>
Thank you for choosing <strong>Glowzy House</strong>. 🤍<br>
Your order has been received successfully.
</p>

<div class="success-note">
    Our team will contact you shortly to confirm your order
    and delivery details.
</div>

<div class="actions">
    <a href="shop.html" class="btn btn-primary">
        <i class="fa-solid fa-bag-shopping"></i>
        Continue Shopping
    </a>

    <a href="index.html" class="btn btn-secondary">
        <i class="fa-solid fa-house"></i>
        Back to Home
    </a>
</div>

</main>
</body>
</html>
